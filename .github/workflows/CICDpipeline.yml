name: Java CI with Maven

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "master","dev" ]

jobs:
  build:

    runs-on: ubuntu-latest
    services:
      postgres:
       image: postgres:16         
       env:
          POSTGRES_DB: testdb          
          POSTGRES_USER: sa
          POSTGRES_PASSWORD: password
       ports:
          - 5432:5432
       options: >-
          --health-cmd pg_isready
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build and Test
      run: mvn -B clean verify
