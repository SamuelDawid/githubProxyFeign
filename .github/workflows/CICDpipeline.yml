name: Java CI with Maven

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "master","dev" ]

jobs:
  build:

    runs-on: ubuntu-latest
    services:
      postgres:
       image: postgres:16         
       env:
          POSTGRES_DB: testdb          
          POSTGRES_USER: sa
          POSTGRES_PASSWORD: password
       ports:
          - 5432:5432
       options: >-
          --health-cmd "pg_isready -U sa -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Cache SonarQube packages
      uses: actions/cache@v5
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    - name: Build, Test, Analyze
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
