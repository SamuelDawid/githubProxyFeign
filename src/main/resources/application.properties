spring.application.name=githubProxy
spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
app.githubClient.url=https://api.github.com/repos
spring.cloud.openfeign.circuitbreaker.enabled=true
logging.level.com.githubProxy=DEBUG
logging.level.org.springframework.security=DEBUG
logstash.host=localhost:5000
app.security.jwt.client-id=github-proxy-api
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/githubProxy-dev
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/githubProxy-dev/protocol/openid-connect/certs